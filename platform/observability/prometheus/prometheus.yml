global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "spring-boot-services"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "host.docker.internal:8080" # API Gateway
          - "host.docker.internal:8081" # Account Service
          - "host.docker.internal:8082" # Listing Service
          - "host.docker.internal:8083" # Rental Service
          - "host.docker.internal:8084" # Payment Service
          - "host.docker.internal:8085" # Search Service
          - "host.docker.internal:8086" # Notification Service
        labels:
          environment: "local"

  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]