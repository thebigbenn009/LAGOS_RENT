networks:
  lagos-rent-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:

services:
  # 1. PostgreSQL Container (6 Isolated Databases)
  postgresql:
    image: postgres:16-alpine
    container_name: lagos-rent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: account_db,listing_db,rental_db,payment_db,search_db,notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - lagos-rent-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lagos-rent-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-lagos_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-lagos_rabbit_password}
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - lagos-rent-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: lagos-rent-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8080"
    volumes:
      - ./platform/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - lagos-rent-net
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '200 OK'" ]
      interval: 15s
      timeout: 5s
      retries: 5
  # ----------------------------------------------------------------------------
  # OBSERVABILITY STACK
  # ----------------------------------------------------------------------------

  # 1. OpenTelemetry Collector (Ingests OTLP traces & metrics)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: lagos-rent-otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./platform/observability/otel-collector/config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver (Spring Boot exports here)
    networks:
      - lagos-rent-net
    depends_on:
      - tempo

  # 2. Grafana Tempo (Distributed Tracing backend)
  tempo:
    image: grafana/tempo:2.5.0
    container_name: lagos-rent-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./platform/observability/tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200" # Tempo HTTP API
    networks:
      - lagos-rent-net

  # 3. Prometheus (Metrics TSDB)
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: lagos-rent-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./platform/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - lagos-rent-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 4. Grafana Loki (Log Aggregation)
  loki:
    image: grafana/loki:3.1.0
    container_name: lagos-rent-loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    volumes:
      - ./platform/observability/loki/loki.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - lagos-rent-net

  # 5. Promtail (Log Shipper for .logs/)
  promtail:
    image: grafana/promtail:3.1.0
    container_name: lagos-rent-promtail
    command: [ "-config.file=/etc/promtail/config.yaml" ]
    volumes:
      - ./platform/observability/promtail/promtail.yaml:/etc/promtail/config.yaml
      - ./.logs:/var/log/lagos-rent:ro
    networks:
      - lagos-rent-net
    depends_on:
      - loki

  # 6. Grafana Cockpit (Visualization)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: lagos-rent-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./platform/observability/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    networks:
      - lagos-rent-net
    depends_on:
      - prometheus
      - tempo
      - loki

  # ----------------------------------------------------------------------------
  # APPLICATION MICROSERVICES (Activated via: docker compose --profile apps up -d)
  # ----------------------------------------------------------------------------

  # 1. Config Server (Port 8888) — Starts first, serves lagos_rent_config
  config-server:
    image: ${IMAGE_PREFIX:-lagos-rent}/config-server:${IMAGE_TAG:-latest}
    build: ./services/config-server
    container_name: lagos-rent-config-server
    profiles: [ "apps" ]
    stop_grace_period: 25s
    environment:
      CONFIG_REPO_URI: file:///config-repo
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    volumes:
      - ../lagos_rent_config:/config-repo:ro
    ports:
      - "8888:8888"
    networks:
      - lagos-rent-net

  # 2. Discovery Service / Eureka (Port 8761) — Waits for Config Server
  discovery-service:
    image: ${IMAGE_PREFIX:-lagos-rent}/discovery-service:${IMAGE_TAG:-latest}
    build: ./services/discovery-service
    container_name: lagos-rent-discovery-service
    profiles: [ "apps" ]
    stop_grace_period: 25s
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8761:8761"
    networks:
      - lagos-rent-net
    depends_on:
      config-server:
        condition: service_healthy

  # 3. API Gateway (Port 8080) — Waits for Config, Eureka, and Keycloak
  api-gateway:
    image: ${IMAGE_PREFIX:-lagos-rent}/api-gateway:${IMAGE_TAG:-latest}
    build: ./services/api-gateway
    container_name: lagos-rent-api-gateway
    profiles: [ "apps" ]
    stop_grace_period: 25s
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/lagos-rent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8080:8080"
    networks:
      - lagos-rent-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # 4. Account Service (Port 8081)
  account-service:
    image: ${IMAGE_PREFIX:-lagos-rent}/account-service:${IMAGE_TAG:-latest}
    build: ./services/account-service
    container_name: lagos-rent-account-service
    profiles: [ "apps" ]
    stop_grace_period: 25s
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      ACCOUNT_DB_URL: jdbc:postgresql://postgresql:5432/account_db
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/lagos-rent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8081:8081"
    networks:
      - lagos-rent-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 5. Listing Service (Port 8082)
  listing-service:
    image: ${IMAGE_PREFIX:-lagos-rent}/listing-service:${IMAGE_TAG:-latest}
    build: ./services/listing-service
    container_name: lagos-rent-listing-service
    profiles: [ "apps" ]
    stop_grace_period: 25s
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      LISTING_DB_URL: jdbc:postgresql://postgresql:5432/listing_db
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/lagos-rent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
    ports:
      - "8082:8082"
    networks:
      - lagos-rent-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 6. Rental Service (Port 8083)
  rental-service:
    image: ${IMAGE_PREFIX:-lagos-rent}/rental-service:${IMAGE_TAG:-latest}
    build: ./services/rental-service
    container_name: lagos-rent-rental-service
    profiles: [ "apps" ]
    stop_grace_period: 25s
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      RENTAL_DB_URL: jdbc:postgresql://postgresql:5432/rental_db
      LISTING_SERVICE_URL: http://listing-service:8082
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/lagos-rent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8083:8083"
    networks:
      - lagos-rent-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 7. Payment Service (Port 8084)
  payment-service:
    image: ${IMAGE_PREFIX:-lagos-rent}/payment-service:${IMAGE_TAG:-latest}
    build: ./services/payment-service
    container_name: lagos-rent-payment-service
    profiles: [ "apps" ]
    stop_grace_period: 25s
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      PAYMENT_DB_URL: jdbc:postgresql://postgresql:5432/payment_db
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/lagos-rent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8084:8084"
    networks:
      - lagos-rent-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 8. Search Service (Port 8085)
  search-service:
    image: ${IMAGE_PREFIX:-lagos-rent}/search-service:${IMAGE_TAG:-latest}
    build: ./services/search-service
    container_name: lagos-rent-search-service
    profiles: [ "apps" ]
    stop_grace_period: 25s
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      SEARCH_DB_URL: jdbc:postgresql://postgresql:5432/search_db
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/lagos-rent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8085:8085"
    networks:
      - lagos-rent-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 9. Notification Service (Port 8086)
  notification-service:
    image: ${IMAGE_PREFIX:-lagos-rent}/notification-service:${IMAGE_TAG:-latest}
    build: ./services/notification-service
    container_name: lagos-rent-notification-service
    profiles: [ "apps" ]
    stop_grace_period: 25s
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
      NOTIFICATION_DB_URL: jdbc:postgresql://postgresql:5432/notification_db
      ACCOUNT_SERVICE_URL: http://account-service:8081
      NOTIFICATION_SERVICE_CLIENT_SECRET: ${NOTIFICATION_SERVICE_CLIENT_SECRET:-secret}
      RESEND_API_KEY: ${RESEND_API_KEY:-re_mock_key}
      RABBITMQ_HOST: rabbitmq
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/lagos-rent
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8086:8086"
    networks:
      - lagos-rent-net
    depends_on:
      config-server:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy