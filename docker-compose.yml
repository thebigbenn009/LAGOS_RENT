version: '3.8'

networks:
  lagos-rent-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:

services:
  # 1. PostgreSQL Container (6 Isolated Databases)
  postgresql:
    image: postgres:16-alpine
    container_name: lagos-rent-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: account_db,listing_db,rental_db,payment_db,search_db,notification_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
      - lagos-rent-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lagos-rent-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-lagos_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-lagos_rabbit_password}
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - lagos-rent-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Keycloak Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: lagos-rent-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8080"
    volumes:
      - ./platform/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - lagos-rent-net
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; cat <&3 | grep -q '200 OK'" ]
      interval: 15s
      timeout: 5s
      retries: 5